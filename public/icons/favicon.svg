<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- 充足留白的圆角底（四周留 64px 边距） -->
  <rect x="64" y="64" width="384" height="384" rx="72" fill="url(#g)"/>

  <!-- 中心弱化底盘，帮助在异形裁切下保持主体聚焦 -->
  <circle cx="256" cy="256" r="136" fill="rgba(255,255,255,0.10)"/>

  <!-- 居中 PWA 文字：控制在安全区内（约画布 50% 宽度），四周留足余量 -->
  <text x="256" y="256"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="140"
        font-weight="800"
        fill="#FFFFFF"
        opacity="0.95"
        filter="url(#shadow)">PWA</text>

  <!-- 简洁勾选标识（象征“支持”），缩小并靠近右下侧但仍在安全区 -->
  <path d="M300 316l22 22 52-52"
        stroke="#10B981" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- 说明：文字与符号总面积远小于安全半径（~200px），保证在圆形/圆角/异形裁切下主体不被截断。 -->
</svg>